# Render Blueprint for the Dazy Club API. Exported from Render on 2026-10-19, then completed.
#
# RULES
#  - NEVER put secret values in this file. Secrets use `sync: false` (value is entered in
#    the Render dashboard, only the NAME is tracked here).
#  - Every env var the API reads (apps/api, `os.environ`) MUST be listed below AND in
#    .env.example. Adding a variable to code = add it to both files in the same PR.
#  - Only the API lives on Render. Not tracked here: Neon DB project, Cloudflare frontends
#    (VITE_API_BASE_URL is a build-time setting there), Razorpay dashboard webhook.
version: "1"
projects:
- name: DazyClub
  environments:
  - name: Production
    services:
    - type: web
      name: dazy_club_pilot
      runtime: docker
      repo: https://github.com/sahn6342/dazy_club_pilot
      branch: main
      plan: free
      # --- Gallery uploads: production uses Cloudflare R2 (DAZY_MEDIA_BACKEND=r2), so no disk is
      # needed and the free-plan filesystem being wiped on redeploy does not matter. A persistent
      # disk is the alternative: uncomment both lines and the disk block, set
      # DAZY_MEDIA_DIR=/data/media and DAZY_MEDIA_LOCAL_OK=1. Image runs as non-root user `app`;
      # verify the mounted disk is writable after deploy.
      # plan: starter
      # disk:
      #   name: dazy-data
      #   mountPath: /data
      #   sizeGB: 1
      region: singapore
      dockerContext: .
      dockerfilePath: ./Dockerfile
      rootDir: apps/api
      healthCheckPath: /api/v1/health
      domains:
      - api.dazyclub.com
      autoDeployTrigger: commit
      envVars:
      # --- Runtime mode: production makes the API refuse to boot on unsafe config
      # (default JWT secret / admin creds, noop payments). Not a secret, so value is tracked.
      - key: DAZY_ENV
        value: production
      # Trusted reverse proxies in front of the API; rate limits key on the Nth-from-right
      # X-Forwarded-For entry (Render alone = 1; put 2 if Cloudflare proxies api.dazyclub.com).
      - key: DAZY_PROXY_HOPS
        value: "1"
      # --- Auth (MUST be non-default in production) ---
      - key: JWT_SECRET            # random 32+ chars; changing it logs everyone out
        sync: false
      - key: ADMIN_USERNAME        # superadmin login (default "admin")
        sync: false
      - key: ADMIN_PASSWORD        # superadmin password (default "admin"); use ADMIN_PASSWORD_HASH instead if possible
        sync: false
      - key: ADMIN_PASSWORD_HASH   # optional bcrypt hash; when set it replaces ADMIN_PASSWORD
        sync: false
      # --- Database / storage ---
      - key: DAZY_DB_URL           # Neon pooled Postgres URL, ends with ?sslmode=require
        sync: false
      - key: DAZY_MEDIA_BACKEND    # r2 (required in production) | local
        value: r2
      - key: R2_ACCOUNT_ID         # Cloudflare account id (R2 > Overview)
        sync: false
      - key: R2_ACCESS_KEY_ID      # R2 API token, Object Read & Write
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL    # public bucket hostname, e.g. https://media.dazyclub.com (no trailing slash)
        sync: false
      - key: DAZY_MEDIA_DIR        # only used by the local backend (needs a disk to persist)
        sync: false
      # --- CORS / links ---
      - key: DAZY_CORS_ORIGINS     # comma-separated exact origins: web, admin, kiosk (no trailing slash)
        sync: false
      - key: DAZY_WEB_BASE_URL     # public customer site URL; used in email links
        sync: false
      # --- Payments ---
      - key: DAZY_PAYMENT_PROVIDER # noop (fake, dev only) | razorpay
        sync: false
      - key: RAZORPAY_KEY_ID       # required when provider=razorpay (startup fails without it)
        sync: false
      - key: RAZORPAY_KEY_SECRET   # required when provider=razorpay
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET # secret of webhook https://api.dazyclub.com/api/v1/payments/razorpay/webhook (payment.captured)
        sync: false
      # --- Bot protection (Cloudflare Turnstile): API verifies tokens; sites use the PUBLIC site key ---
      - key: TURNSTILE_SECRET      # required in production (API refuses to boot without it)
        sync: false
      # --- WhatsApp OTP via Meta Cloud API (only when DAZY_NOTIFY_WHATSAPP_PROVIDER=whatsapp_cloud) ---
      - key: DAZY_NOTIFY_WHATSAPP_PROVIDER  # whatsapp_stub (default) | whatsapp_cloud
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_PHONE_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE # approved authentication template name
        sync: false
      # --- Staff session cookies (admin + kiosk). Defaults suit an API and SPAs under one registrable
      # domain (admin.dazyclub.com / pos.dazyclub.com / api.dazyclub.com): SameSite=Lax, Secure in production.
      # If an SPA is on a different site (e.g. *.pages.dev) set DAZY_COOKIE_SAMESITE=none (forces Secure).
      - key: DAZY_COOKIE_SAMESITE  # lax (default) | strict | none
        sync: false
      - key: DAZY_COOKIE_DOMAIN    # optional, e.g. .dazyclub.com; unset = cookie is bound to the API host only
        sync: false
      - key: ADMIN_SESSION_EPOCH   # integer; bump it to sign out every env-admin session at once (default 0)
        sync: false
      # --- Scheduler: an external cron POSTs /api/v1/internal/sweep with header X-Internal-Token ---
      - key: DAZY_INTERNAL_TOKEN   # random 32+ chars; endpoint is disabled (404) when unset
        sync: false
      # --- Notifications ---
      - key: DAZY_NOTIFY_PROVIDER  # console (log only) | email (SMTP)
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT             # default 587
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Not listed on purpose: DAZY_DB_PATH (SQLite only, ignored when DAZY_DB_URL is set),
      # DAZY_NOTIFY_SMS_PROVIDER (stub; default is fine), WHATSAPP_TEMPLATE_LANG and
      # WHATSAPP_DEFAULT_COUNTRY_CODE (defaults "en" / "91").
