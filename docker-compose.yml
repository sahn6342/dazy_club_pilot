# Production deployment: one API container, three static-frontend containers,
# and a Caddy edge for automatic HTTPS. See docs/Docker-Deployment.md.
#
#   cp .env.example .env   # fill in real values, then:
#   docker compose up -d --build

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DAZY_CORS_ORIGINS: https://${WEB_DOMAIN},https://${ADMIN_DOMAIN},https://${KIOSK_DOMAIN}
      # Payment adapter — defaults keep a keyless deploy bootable in dev/no-op mode.
      DAZY_PAYMENT_PROVIDER: ${DAZY_PAYMENT_PROVIDER:-noop}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Notification adapter — console prints to `docker compose logs api`.
      DAZY_NOTIFY_PROVIDER: ${DAZY_NOTIFY_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Used in notification links (e.g. the /my-bookings payment-resume link).
      DAZY_WEB_BASE_URL: https://${WEB_DOMAIN}
      # DAZY_DB_PATH / DAZY_MEDIA_DIR default to /data/... inside the image (see apps/api/Dockerfile).
      # Point DAZY_DB_URL at Postgres here instead, with zero code changes, if/when you outgrow SQLite.
    volumes:
      - api_data:/data
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP: web
        VITE_API_BASE_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    expose:
      - "80"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP: admin
        VITE_API_BASE_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    expose:
      - "80"

  kiosk:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP: kiosk
        VITE_API_BASE_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      KIOSK_DOMAIN: ${KIOSK_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - admin
      - kiosk

volumes:
  api_data:      # dazy.db + uploaded media — back this up regularly
  caddy_data:    # TLS certificates
  caddy_config:
